name: Fetch the Doha adhans

# One-off: brings the public domain recordings from the Internet Archive
# into the repository. Removed once they are in.
on:
  push:
    branches: [claude/mushaf-dhikr]
    paths: [.github/workflows/fetch-doha.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download and convert
        run: |
          set -euo pipefail
          base=https://archive.org/download/adhan.recordings.from.doha.qatar
          out=android/app/src/main/res/raw
          i=1
          for name in Fajr Dhuhr Asr Maghrib Isha; do
            src="Adhan_Doha_Qatar_0${i}_${name}_Adhan.mp3"
            curl -fsSL --retry 5 --retry-delay 10 -o "/tmp/$src" "$base/$src"
            ffprobe -v error -show_entries format=duration -of csv=p=0 "/tmp/$src"
            ffmpeg -v error -y -i "/tmp/$src" -vn -map_metadata -1 -ac 1 \
              -c:a aac -b:a 80k -ar 44100 "$out/azan_doha_${name,,}.m4a"
            i=$((i + 1))
          done
          ls -la "$out"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/res/raw
          git commit -m "Add the Doha adhan recordings (Internet Archive, Public Domain Mark)"
          git push
