name: Android

on:
  push:
    branches: [main]
    # A tag like v1.0.0 builds a release and publishes it on GitHub.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      MYFAITH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'myfaith-sideload' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # A build installs over the previous one only when both carry the same
      # signature. The key comes from the repository secrets when they are
      # set; otherwise one is generated once and kept in the Actions cache.
      - name: Restore the cached signing key
        if: env.KEYSTORE_BASE64 == ''
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/myfaith.jks
          key: signing-key-v1
      - name: Prepare the signing key
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/myfaith.jks"
          elif [ ! -f "$RUNNER_TEMP/myfaith.jks" ]; then
            keytool -genkeypair -keystore "$RUNNER_TEMP/myfaith.jks" \
              -storepass "$MYFAITH_KEYSTORE_PASSWORD" -alias myfaith \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MyFaith"
          fi
          echo "MYFAITH_KEYSTORE=$RUNNER_TEMP/myfaith.jks" >> "$GITHUB_ENV"
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # Releases only: Google Play takes an app bundle, and it must always be
      # signed with the same key, so a release needs the key from the secrets.
      - name: Require the release key
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Set the KEYSTORE_BASE64 and KEYSTORE_PASSWORD repository secrets before tagging a release."
          exit 1
      - name: Build the app bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter build appbundle --release
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "MyFaith-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "MyFaith-${GITHUB_REF_NAME}.aab"
          # The release may already exist when the tag was made from the
          # "Draft a new release" page; then only the files are added.
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "MyFaith ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "MyFaith-${GITHUB_REF_NAME}.apk" "MyFaith-${GITHUB_REF_NAME}.aab"
