name: Fetch the dua after the adhan

# One-off: brings the recording from hisnmuslim.com into the repository.
# Removed once it is in.
on:
  push:
    branches: [claude/v1.2]
    paths: [.github/workflows/fetch-dua.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download and convert
        run: |
          set -euo pipefail
          out=android/app/src/main/res/raw
          curl -fsSL --retry 5 --retry-delay 10 -o /tmp/25.mp3 https://www.hisnmuslim.com/audio/ar/25.mp3
          ffprobe -v error -show_entries format=duration,bit_rate -of csv=p=0 /tmp/25.mp3
          ffmpeg -v error -y -i /tmp/25.mp3 -vn -map_metadata -1 -ac 1 \
            -c:a aac -b:a 80k -ar 44100 "$out/dua_after_adhan.m4a"
          ls -la "$out"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/res/raw
          git commit -m "Add the recording of the dua after the adhan (hisnmuslim.com)"
          git push
