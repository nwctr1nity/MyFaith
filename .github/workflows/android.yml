name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      MYFAITH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'myfaith-sideload' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # A build installs over the previous one only when both carry the same
      # signature. The key comes from the repository secrets when they are
      # set; otherwise one is generated once and kept in the Actions cache.
      - name: Restore the cached signing key
        if: env.KEYSTORE_BASE64 == ''
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/myfaith.jks
          key: signing-key-v1
      - name: Prepare the signing key
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/myfaith.jks"
          elif [ ! -f "$RUNNER_TEMP/myfaith.jks" ]; then
            keytool -genkeypair -keystore "$RUNNER_TEMP/myfaith.jks" \
              -storepass "$MYFAITH_KEYSTORE_PASSWORD" -alias myfaith \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MyFaith"
          fi
          echo "MYFAITH_KEYSTORE=$RUNNER_TEMP/myfaith.jks" >> "$GITHUB_ENV"
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
